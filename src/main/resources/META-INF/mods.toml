modLoader = "javafml"
loaderVersion = "[${forge_major},)"
license = "AGPL-3.0-only"
issueTrackerURL = "https://github.com/FireBall1725/DevWorld3/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
logoFile = "devworldLogo.png"
authors = "${authors}"
displayURL = "https://github.com/FireBall1725/DevWorld3/wiki"
description = '''${description}'''

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_major},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"
