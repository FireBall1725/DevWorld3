name: Publish

# A v* tag publishes for real. Run it by hand to dry-run: nothing is uploaded unless dry_run is turned off.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would be uploaded, and upload nothing
        type: boolean
        default: true

env:
  UPLOAD: ${{ github.event_name == 'push' || inputs.dry_run == false }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [1.19.2-fabric, 1.19.2-forge, 1.20.1-fabric, 1.20.1-forge, 1.21.1-fabric, 1.21.1-neoforge,
               26.1-fabric, 26.1-neoforge, 26.2-fabric, 26.2-neoforge, 26.3-fabric, 26.3-neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: The tag matches mod.version
        if: github.event_name == 'push'
        run: |
          mod=$(sed -n 's/^mod.version = "\(.*\)"/\1/p' stonecutter.properties.toml)
          if [ "v$mod" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod.version $mod in stonecutter.properties.toml"
            exit 1
          fi
      - name: The upload tokens are set
        if: env.UPLOAD == 'true'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          [ -n "$CURSEFORGE_TOKEN" ] || { echo "CURSEFORGE_TOKEN is not set"; exit 1; }
          [ -n "$MODRINTH_TOKEN" ] || { echo "MODRINTH_TOKEN is not set"; exit 1; }
      - name: Build and test
        run: ./gradlew :${{ matrix.node }}:build -x checkstyleMain -x checkstyleTest
      - name: Publish to CurseForge and Modrinth
        env:
          PUBLISH_MODS: ${{ env.UPLOAD }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew :${{ matrix.node }}:publishMods
      - uses: actions/upload-artifact@v4
        with:
          name: DevWorld3-${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/libs/*.jar
            !versions/${{ matrix.node }}/build/libs/*-sources.jar
          if-no-files-found: error

  # One release with all six jars, from a tag only
  release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: DevWorld3-*
          merge-multiple: true
          path: jars
      - uses: softprops/action-gh-release@v2
        with:
          files: jars/*.jar
          generate_release_notes: true

  # Announces the release on Discord, from a tag only
  announce:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Read the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" --json body --jq .body > notes.md

      - name: Post to the Announcements channel
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_MODS_WEBHOOK }}
          MOD_NAME: DevWorld
          # Keep in step with the matrix above.
          MC_VERSIONS: "1.19.2, 1.20.1, 1.21.1, 26.1, 26.2, 26.3"
          LINKS: Modrinth|https://modrinth.com/project/FGQpIsgp;CurseForge|https://www.curseforge.com/minecraft/mc-mods/devworld;GitHub|https://github.com/FireBall1725/DevWorld3/releases/tag/${{ github.ref_name }}
          NOTES_FILE: notes.md
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            *-alpha*) KIND=Alpha ;;
            *-beta*|*-rc*) KIND=Beta ;;
            *) KIND=Stable ;;
          esac
          export KIND
          python3 -I .github/announce/announce-mod.py
